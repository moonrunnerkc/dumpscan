name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # The tag is not a licence to skip the gate. A release that cannot pass
      # the determinism run is not a release.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:determinism

      - name: check the workspace is publishable at this tag
        run: node scripts/check-release.mjs "${GITHUB_REF_NAME}"

      # npm answers an authorization failure on a scoped package with a 404, not
      # a 403, so a failed publish cannot tell you whether the token was wrong,
      # the scope was missing, or the permission was. Say who we are first.
      - name: check the registry credential
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "NPM_TOKEN is not set; skipping the publish below." >&2
            exit 0
          fi
          # Not $(npm whoami) inside an echo: a failure there is swallowed by
          # command substitution, so the step passes while reporting nobody.
          # That is exactly how a secret holding the literal string "-" reached
          # four publish attempts before anyone noticed.
          if ! whoami_output=$(npm whoami 2>&1); then
            echo "npm does not recognise NPM_TOKEN: ${whoami_output}" >&2
            echo "The secret is set but the registry rejected it. Check it holds the" >&2
            echo "token itself: gh secret set NPM_TOKEN < token.txt, and note that" >&2
            echo "gh secret set --body takes a literal value, not a - for stdin." >&2
            exit 1
          fi
          echo "authenticated as: ${whoami_output}"
          echo "npm version: $(npm --version)"
          echo "reachable packages in the @dumpscan scope:"
          npm access list packages @dumpscan || echo "  (none, or the scope is not readable by this token)"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Published in dependency order so a consumer never resolves a version of
      # dumpscan whose @dumpscan/* dependencies are not on the registry yet.
      - name: publish
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "NPM_TOKEN is not set, so nothing was published." >&2
            echo "The gate above still ran, so the tag is good. Add the NPM_TOKEN secret" >&2
            echo "and re-run this workflow to publish the same commit." >&2
            exit 0
          fi
          for pkg in canon merkle osv versions lockfiles predicate match sign explain diff cli; do
            name=$(node -p "require('./packages/$pkg/package.json').name")
            version=$(node -p "require('./packages/$pkg/package.json').version")
            # A publish that dies partway leaves the earlier packages on the
            # registry. Without this, re-running the job fails on the first one
            # instead of finishing the rest.
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skipping $name@$version, already on the registry"
              continue
            fi
            echo "publishing $name@$version"
            pnpm --filter "./packages/$pkg" publish --access public --no-git-checks
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
